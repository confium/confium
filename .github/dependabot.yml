# Dependabot configuration for confium
#
# Keeps cargo dependencies, GitHub Actions, and Docker base images current.
# Updates are grouped by ecosystem and run weekly to reduce PR noise.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates

version: 2

updates:
  # Rust workspace dependencies (Cargo.lock across all crates).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      cargo-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # GitHub Actions used in .github/workflows/*.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"

  # Dockerfile base images (root and per-crate Dockerfiles).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      docker-base-images:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
