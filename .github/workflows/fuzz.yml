# Weekly fuzz run for Confium.
#
# Runs each cargo-fuzz target for 60 seconds on a schedule (every Monday
# 09:00 UTC) and on manual dispatch. Findings (corpus + crash artifacts)
# are uploaded as workflow artifacts for triage. This workflow is
# intentionally separate from CI: fuzzing is best-effort, not a gate.

name: Fuzz

on:
  schedule:
    # Every Monday at 09:00 UTC.
    - cron: "0 9 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - plugin_loader
          - hash_interface
          - error_chain
          - keyfmt_parse
        include:
          # LeakSanitizer found a real leak in the plugin_loader
          # target (see TODO.complete/68). Until it is fixed, that
          # one target runs with leak detection scoped off; the
          # other three keep full ASan+LSan coverage.
          - target: plugin_loader
            libfuzzer_flags: "-detect_leaks=0"
          - target: hash_interface
            libfuzzer_flags: ""
          - target: error_chain
            libfuzzer_flags: ""
          - target: keyfmt_parse
            libfuzzer_flags: ""
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          # cargo-fuzz builds sanitizer targets for both libc flavors;
          # the musl target isn't shipped with the default profile.
          targets: x86_64-unknown-linux-musl,x86_64-unknown-linux-gnu

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Cache cargo-fuzz corpus
        uses: actions/cache@v6
        with:
          path: |
            fuzz/target
            fuzz/corpus
          key: fuzz-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-${{ matrix.target }}-

      - name: Run fuzz target
        working-directory: fuzz
        # cargo-fuzz passes -Zsanitizer, nightly-only. The repo's
        # rust-toolchain.toml pins stable and overrides the action's
        # default, so force nightly via RUSTUP_TOOLCHAIN. The gnu
        # target is used because musl's static libc is incompatible
        # with the sanitizer runtime.
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: >-
          cargo fuzz run ${{ matrix.target }}
          --target x86_64-unknown-linux-gnu
          -- -max_total_time=60 ${{ matrix.libfuzzer_flags }}

      - name: Collect artifacts
        if: failure()
        run: |
          set -eux
          mkdir -p fuzz-artifacts/${{ matrix.target }}
          # Crash files and corpus are written under fuzz/ by cargo-fuzz.
          find fuzz \( -name 'crash-*' -o -name 'oom-*' -o -name 'timeout-*' \) -print0 \
            | xargs -0 -r cp -t fuzz-artifacts/${{ matrix.target }}/ || true
          cp -r fuzz/corpus/${{ matrix.target }} \
            fuzz-artifacts/${{ matrix.target }}/corpus 2>/dev/null || true

      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz-artifacts/
          retention-days: 30
