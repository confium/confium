# Performance regression tracking.
#
# Runs the crates/confium-benchmarks suite on PRs that touch crypto
# crates, posts a delta-vs-main comment on the PR, and fails on >10%
# regression on the headline benchmarks.
#
# Tunable: edit the [thresholds] section below to adjust per-bench
# sensitivity.

name: Performance

on:
  pull_request:
    paths:
      # Only run when crypto-relevant code changes.
      - "crates/confium-tc-*/**"
      - "crates/confium-composite/**"
      - "crates/confium-transparency/**"
      - "crates/confium-crypto-*/**"
      - "crates/confium-privacy/**"
      - "crates/confium-benchmarks/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # We need main to diff against.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-perf-${{ hashFiles('Cargo.lock') }}

      - name: Run benchmarks
        # Plain criterion run: verifies every bench compiles and
        # completes, catching perf-relevant breakage. Full results
        # print to the job log (~10 min for this suite).
        #
        # CodSpeed integration is deliberately not wired: the
        # criterion-compat crate requires builds wrapped by
        # cargo-codspeed (its runner sets CODSPEED_* env), which
        # this workflow doesn't use. Re-add via that tool if
        # dashboard tracking is wanted.
        run: cargo bench -p confium-benchmarks
