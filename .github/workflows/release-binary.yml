# Build static CLI binaries for `confium` on Linux, macOS, Windows.
#
# Triggered on release tags (v*.*.*) and via workflow_dispatch.
# Uploads binaries to the corresponding GitHub Release.
#
# Uses a fully-static musl build on Linux for maximum portability.
# Generates SBOM (CycloneDX) and SLSA build provenance attestations
# so consumers can verify the supply chain of each artifact.

name: Release Binaries

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  # Required for SLSA build provenance attestation (actions/attest-build-provenance).
  id-token: write
  # Required for attestation upload.
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl

      # musl-tools provides x86_64-linux-musl-gcc which the `ring`
      # crate's build script needs for static Linux builds.
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build x86_64 (musl, static)
        run: cargo build --release --target x86_64-unknown-linux-musl -p confium-cli

      - name: Build aarch64 (musl, static)
        run: cargo build --release --target aarch64-unknown-linux-musl -p confium-cli

      - name: Package binaries
        run: |
          mkdir -p dist
          tar -czf dist/confium-linux-x86_64.tar.gz -C target/x86_64-unknown-linux-musl/release confium
          tar -czf dist/confium-linux-aarch64.tar.gz -C target/aarch64-unknown-linux-musl/release confium

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: confium-linux
          path: dist/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build --release --target x86_64-apple-darwin -p confium-cli

      - name: Build aarch64 (Apple Silicon)
        run: cargo build --release --target aarch64-apple-darwin -p confium-cli

      - name: Package binaries
        run: |
          mkdir -p dist
          tar -czf dist/confium-macos-x86_64.tar.gz -C target/x86_64-apple-darwin/release confium
          tar -czf dist/confium-macos-aarch64.tar.gz -C target/aarch64-apple-darwin/release confium

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: confium-macos
          path: dist/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Build x86_64 (GNU)
        run: cargo build --release --target x86_64-pc-windows-gnu -p confium-cli

      - name: Package binaries
        shell: bash
        run: |
          mkdir -p dist
          7z a dist/confium-windows-x86_64.zip ./target/x86_64-pc-windows-gnu/release/confium.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: confium-windows
          path: dist/

  release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/

      # Generate a CycloneDX SBOM from the workspace Cargo.lock. This is
      # the canonical record of every transitive dependency shipped in
      # the binaries. Uploads alongside the binaries as a release asset.
      - name: Generate SBOM (CycloneDX)
        run: |
          cargo install cargo-cyclonedx --locked --quiet
          cargo cyclonedx --format json --output-pattern package --output-directory dist/
          # Flatten the per-crate SBOMs into one rollup that consumers can verify.
          jq -s 'map(.components) | {components: add, bomFormat: "CycloneDX", specVersion: "1.5", version: 1}' \
            dist/*.cdx.json > dist/confium-sbom.cdx.json

      # Generate SLSA build provenance attestation for every release
      # artifact. The attestation is recorded in the repo's
      # "Attestations" tab and verifiable via `gh attestation verify`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/confium-linux/*.tar.gz
            dist/confium-macos/*.tar.gz
            dist/confium-windows/*.zip

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/confium-linux/*.tar.gz
            dist/confium-macos/*.tar.gz
            dist/confium-windows/*.zip
            dist/confium-sbom.cdx.json
          generate_release_notes: true
          fail_on_unmatched_files: true

