# Build and publish RustDoc API documentation for all published Confium crates.
#
# Deploys to GitHub Pages at the `rustdoc` environment, alongside the
# AsciiDoc project documentation deployed by docs.yml.
#
# Output: rendered RustDoc for every workspace member crate, plus a
# top-level index linking to each crate's documentation.

name: RustDoc

on:
  push:
    branches:
      - main
    paths:
      - "crates/**/*.rs"
      - "crates/**/Cargo.toml"
      - "Cargo.toml"
      - ".github/workflows/rustdoc.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rustdoc-pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Configure cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build RustDoc
        # Default features only: --all-features pulls confium-store-tpm's
        # `real-tss` (tss-esapi 8.0.0-alpha), whose generated bindings
        # don't compile against distro libtss2-dev headers. The published
        # crate surface is fully covered by default features.
        run: |
          cargo doc --workspace --no-deps
          # Generate top-level index page
          cat > target/doc/index.html <<'HTMLEOF'
          <!DOCTYPE html>
          <html>
          <head><title>Confium RustDoc</title></head>
          <body>
          <h1>Confium RustDoc</h1>
          <p>API documentation for all published Confium crates.</p>
          <ul>
          HTMLEOF
          for crate_dir in crates/*/; do
            crate_name=$(basename "$crate_dir")
            if [ -d "target/doc/${crate_name//-/_}" ]; then
              echo "<li><a href=\"${crate_name//-/_}/index.html\">${crate_name}</a></li>" >> target/doc/index.html
            fi
          done
          cat >> target/doc/index.html <<'HTMLEOF'
          </ul>
          <p>Project documentation: <a href="https://confium.org">confium.org</a></p>
          </body>
          </html>
          HTMLEOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/doc
          # actions/deploy-pages consumes the artifact literally named
          # "github-pages"; the custom name made it invisible to the
          # deploy job.

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: rustdoc
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
