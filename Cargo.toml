[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
authors = ["Ribose Open <open.source@ribose.com>"]
license = "BSD-2-Clause"
homepage = "https://www.confium.org/"
repository = "https://github.com/confium/confium"
categories = ["authentication", "cryptography"]
[workspace.dependencies]
confium-api = { path = "crates/confium-api", version = "0.3.0" }
confium-core = { path = "crates/confium-core", version = "0.2.0" }
confium-macros = { path = "crates/confium-macros", version = "0.3.0" }
confium-net = { path = "crates/confium-net", version = "0.3.0" }
confium-net-quic = { path = "crates/confium-net-quic", version = "0.3.0" }
confium-net-tcp = { path = "crates/confium-net-tcp", version = "0.3.0" }
confium-net-ws = { path = "crates/confium-net-ws", version = "0.3.0" }
confium-registry = { path = "crates/confium-registry", version = "0.3.0" }
confium-store = { path = "crates/confium-store", version = "0.3.0" }
confium-store-pkcs11 = { path = "crates/confium-store-pkcs11", version = "0.3.0" }
confium-store-tpm = { path = "crates/confium-store-tpm", version = "0.3.0" }
confium-tc = { path = "crates/confium-tc", version = "0.3.0" }
libloading = "0.8"
snafu = "0.8"
inventory = "0.3"
zeroize = "1.8"
url = "2.5"
clap = { version = "4.5", features = ["derive"] }
ureq = "2.12"
toml = "0.8"
toml_edit = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
sha2 = "0.10"
hmac = "0.12"
tempfile = "3"
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "sync", "macros", "time", "io-util"] }
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }
# WebSocket framing + handshake for confium-net-ws. MIT OR Apache-2.0.
# `rustls-tls-native-roots` enables `wss://` via rustls using the
# platform's native CA store.
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "url", "rustls-tls-native-roots"] }
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
[profile.release.package."*"]
opt-level = "s"
