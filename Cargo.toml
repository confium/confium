[workspace]
resolver = "2"
members = [
    "crates/confium-api",
    "crates/confium-attributes",
    "crates/confium-it",
    "crates/confium-signatif",
    "crates/confium-pki",
    "crates/confium-cli",
    "crates/confium-composite",
    "crates/confium-deployment",
    "crates/confium-core",
    "crates/confium-daemon",
    "crates/confium-patterns",
    "crates/confium-examples",
    "crates/confium-jce-provider",
    "crates/confium-macros",
    "crates/confium-mock-plugin",
    "crates/confium-net",
    "crates/confium-net-noise",
    "crates/confium-net-quic",
    "crates/confium-net-tcp",
    "crates/confium-net-ws",
    "crates/confium-openssl-provider",
    "crates/confium-pkcs11-server",
    "crates/confium-publish",
    "crates/confium-registry",
    "crates/confium-ring",
    "crates/confium-sandbox-process",
    "crates/confium-sandbox-wasm",
    "crates/confium-store",
    "crates/confium-store-cloud",
    "crates/confium-store-openpgp-card",
    "crates/confium-store-pkcs11",
    "crates/confium-store-tpm",
    "crates/confium-tc",
    "crates/confium-tc-bls",
    "crates/confium-tc-cmp20",
    "crates/confium-tc-core",
    "crates/confium-tc-ecies-p256",
    "crates/confium-tc-elgamal-p256",
    "crates/confium-tc-fhe-bfv",
    "crates/confium-tc-frost-ed25519",
    "crates/confium-tc-frost-ml-dsa-65",
    "crates/confium-tc-frost-p256",
    "crates/confium-tc-gg18",
    "crates/confium-tc-keys",
    "crates/confium-tc-ml-kem",
    "crates/confium-test-harness",
    "crates/confium-tls-signer",
    "crates/confium-transparency",
    "crates/confium-wasm",
    "crates/confium-benchmarks",
    # Layer 0: Shared crypto (publishable).
    "crates/confium-crypto-vss",
    "crates/confium-crypto-zk",
    "crates/confium-privacy",
    "crates/confium-observability",
    # Layer 3: Product components.
    "crates/confium-coordinator",
    "crates/confium-pki-tc",
    # Deployable surfaces.
    "crates/confium-signerd",
    "crates/confium-log-server",
    "crates/confium-log-monitor",
    "crates/confium-verify-server",
    "crates/confium-operator",
    "crates/confium-oidc",
    "crates/confium-node",
    "crates/confium-fuzz",
    # Product facade crates (Layer 3 entry points).
    "crates/confium-threshold",
    "crates/confium-keyless",
    "crates/confium-verify",
]

[workspace.package]
version = "0.8.3"
edition = "2024"
rust-version = "1.85"
authors = ["Ribose Open <open.source@ribose.com>"]
license = "BSD-2-Clause"
homepage = "https://www.confium.org/"
repository = "https://github.com/confium/confium"
categories = ["authentication", "cryptography"]

[workspace.dependencies]
confium-api = { path = "crates/confium-api", version = "0.8.3" }
confium-attributes = { path = "crates/confium-attributes", version = "0.8.3" }
confium-signatif = { path = "crates/confium-signatif", version = "0.8.3" }
confium-core = { path = "crates/confium-core", version = "0.8.3" }
confium-composite = { path = "crates/confium-composite", version = "0.8.3" }
confium-deployment = { path = "crates/confium-deployment", version = "0.8.3" }
confium-daemon = { path = "crates/confium-daemon", version = "0.8.3" }
confium-jce-provider = { path = "crates/confium-jce-provider", version = "0.8.3" }
confium-macros = { path = "crates/confium-macros", version = "0.8.3" }
confium-mock-plugin = { path = "crates/confium-mock-plugin", version = "0.8.3" }
confium-net = { path = "crates/confium-net", version = "0.8.3" }
confium-net-noise = { path = "crates/confium-net-noise", version = "0.8.3" }
confium-net-quic = { path = "crates/confium-net-quic", version = "0.8.3" }
confium-net-tcp = { path = "crates/confium-net-tcp", version = "0.8.3" }
confium-net-ws = { path = "crates/confium-net-ws", version = "0.8.3" }
confium-openssl-provider = { path = "crates/confium-openssl-provider", version = "0.8.3" }
confium-patterns = { path = "crates/confium-patterns", version = "0.8.3" }
confium-pki = { path = "crates/confium-pki", version = "0.8.3" }
confium-pkcs11-server = { path = "crates/confium-pkcs11-server", version = "0.8.3" }
confium-registry = { path = "crates/confium-registry", version = "0.8.3" }
confium-ring = { path = "crates/confium-ring", version = "0.8.3" }
confium-sandbox-process = { path = "crates/confium-sandbox-process", version = "0.8.3" }
confium-sandbox-wasm = { path = "crates/confium-sandbox-wasm", version = "0.8.3" }
confium-store = { path = "crates/confium-store", version = "0.8.3" }
confium-store-cloud = { path = "crates/confium-store-cloud", version = "0.8.3" }
confium-store-openpgp-card = { path = "crates/confium-store-openpgp-card", version = "0.8.3" }
confium-store-pkcs11 = { path = "crates/confium-store-pkcs11", version = "0.8.3" }
confium-store-tpm = { path = "crates/confium-store-tpm", version = "0.8.3" }
confium-tc = { path = "crates/confium-tc", version = "0.8.3" }
confium-tc-bls = { path = "crates/confium-tc-bls", version = "0.8.3" }
confium-tc-cmp20 = { path = "crates/confium-tc-cmp20", version = "0.8.3" }
confium-tc-ecies-p256 = { path = "crates/confium-tc-ecies-p256", version = "0.8.3" }
confium-tc-elgamal-p256 = { path = "crates/confium-tc-elgamal-p256", version = "0.8.3" }
confium-tc-fhe-bfv = { path = "crates/confium-tc-fhe-bfv", version = "0.8.3" }
confium-tc-frost-ed25519 = { path = "crates/confium-tc-frost-ed25519", version = "0.8.3" }
confium-tc-frost-ml-dsa-65 = { path = "crates/confium-tc-frost-ml-dsa-65", version = "0.8.3" }
confium-tc-frost-p256 = { path = "crates/confium-tc-frost-p256", version = "0.8.3" }
confium-tc-gg18 = { path = "crates/confium-tc-gg18", version = "0.8.3" }
confium-tc-ml-kem = { path = "crates/confium-tc-ml-kem", version = "0.8.3" }
confium-test-harness = { path = "crates/confium-test-harness", version = "0.8.3" }
confium-tls-signer = { path = "crates/confium-tls-signer", version = "0.8.3" }
confium-transparency = { path = "crates/confium-transparency", version = "0.8.3" }
confium-wasm = { path = "crates/confium-wasm", version = "0.8.3" }
# Layer 0: Shared crypto (publishable).
confium-crypto-vss = { path = "crates/confium-crypto-vss", version = "0.8.3" }
confium-crypto-zk = { path = "crates/confium-crypto-zk", version = "0.8.3" }
confium-privacy = { path = "crates/confium-privacy", version = "0.8.3" }
confium-observability = { path = "crates/confium-observability", version = "0.8.3" }
# Layer 3: Threshold core + components.
confium-tc-core = { path = "crates/confium-tc-core", version = "0.8.3" }
confium-tc-keys = { path = "crates/confium-tc-keys", version = "0.8.3" }
confium-coordinator = { path = "crates/confium-coordinator", version = "0.8.3" }
confium-pki-tc = { path = "crates/confium-pki-tc", version = "0.8.3" }
# Deployable surfaces.
confium-signerd = { path = "crates/confium-signerd", version = "0.4.0" }
confium-log-server = { path = "crates/confium-log-server", version = "0.8.3" }
confium-log-monitor = { path = "crates/confium-log-monitor", version = "0.8.3" }
confium-verify-server = { path = "crates/confium-verify-server", version = "0.8.3" }
confium-operator = { path = "crates/confium-operator", version = "0.8.3" }
confium-oidc = { path = "crates/confium-oidc", version = "0.8.3" }
confium-node = { path = "crates/confium-node", version = "0.8.3" }
confium-fuzz = { path = "crates/confium-fuzz", version = "0.4.0" }
# Product facade crates (Layer 3 entry points).
confium-threshold = { path = "crates/confium-threshold", version = "0.8.3" }
confium-keyless = { path = "crates/confium-keyless", version = "0.8.3" }
confium-verify = { path = "crates/confium-verify", version = "0.8.3" }

libloading = "0.9"
snafu = "0.9"
inventory = "0.3"
zeroize = "1.8"
url = "2.5"
clap = { version = "4.5", features = ["derive"] }
ureq = "3.4"
toml = "1.1"
toml_edit = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
sha2 = "0.11"
hmac = "0.13"
tempfile = "3"
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "sync", "macros", "time", "io-util"] }
criterion = { version = "0.8", default-features = false, features = ["plotters", "cargo_bench_support"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "url", "rustls-tls-native-roots"] }
wasmtime = "48"
# Shared by extracted crates (Layer 0/3).
subtle = "2"
num-bigint = { version = "0.4", features = ["rand"] }
num-integer = "0.1"
num-traits = "0.2"
proptest = "1"
cryptoki = "0.12"
curve25519-dalek = { version = "5", features = ["rand_core"] }
# rnp-rs: idiomatic Rust binding to librnp (OpenPGP C FFI). Published on
# crates.io. We alias to `rnp` because the crate's lib name is `rnp`.
rnp = { package = "rnp-rs", version = "0.1.10" }
ed25519-dalek = "3"
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }
aes-gcm = "0.11"
rand = { version = "0.8", default-features = false, features = ["std", "getrandom"] }
hex = "0.4"
tokio-util = { version = "0.7", features = ["codec"] }
x509-cert = { version = "0.3", features = ["builder"] }
der = "0.8"
spki = "0.8"
ml-dsa = { version = "0.1", features = ["rand_core"] }
slh-dsa = { version = "=0.2.0-rc.5" }
p256 = { version = "0.14", features = ["ecdsa", "pem", "arithmetic"] }
p384 = "0.14"
ecdsa = "0.17"
signature = "3"
elliptic-curve = { version = "0.14", features = ["getrandom"] }
crypto-bigint = "0.7"
getrandom = { version = "0.4", features = ["sys_rng"] }
base64ct = { version = "1", features = ["alloc"] }
qrcode = { version = "0.14", default-features = false }
openpgp-card = "0.5"
card-backend-pcsc = "0.5"
chrono = { version = "0.4", features = ["serde"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
rusqlite = { version = "0.40", features = ["bundled"] }
async-trait = "0.1"
pyo3 = { version = "0.22", features = ["extension-module"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
data-encoding = "2"
thiserror = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.release.package."*"]
opt-level = "s"
