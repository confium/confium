[workspace]
resolver = "2"
members = [
    "crates/confium-api",
    "crates/confium-cli",
    "crates/confium-core",
    "crates/confium-daemon",
    "crates/confium-macros",
    "crates/confium-net",
    "crates/confium-net-tcp",
    "crates/confium-publish",
    "crates/confium-registry",
    "crates/confium-store",
    "crates/confium-tc",
    "crates/confium-test-harness",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
authors = ["Ribose Open <open.source@ribose.com>"]
license = "BSD-2-Clause"
homepage = "https://www.confium.org/"
repository = "https://github.com/confium/confium"
categories = ["authentication", "cryptography"]

[workspace.dependencies]
confium-api = { path = "crates/confium-api", version = "0.3.0" }
confium-core = { path = "crates/confium-core", version = "0.2.0" }
confium-daemon = { path = "crates/confium-daemon", version = "0.3.0" }
confium-macros = { path = "crates/confium-macros", version = "0.3.0" }
confium-net = { path = "crates/confium-net", version = "0.3.0" }
confium-net-tcp = { path = "crates/confium-net-tcp", version = "0.3.0" }
confium-registry = { path = "crates/confium-registry", version = "0.3.0" }
confium-store = { path = "crates/confium-store", version = "0.3.0" }
confium-tc = { path = "crates/confium-tc", version = "0.3.0" }

libloading = "0.8"
snafu = "0.8"
inventory = "0.3"
zeroize = "1.8"
url = "2.5"
clap = { version = "4.5", features = ["derive"] }
ureq = "2.12"
toml = "0.8"
toml_edit = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
sha2 = "0.10"
hmac = "0.12"
tempfile = "3"
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.release.package."*"]
opt-level = "s"
