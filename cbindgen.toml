    "cfm_aead_finalize",
    "cfm_aead_verify_tag",
    "cfm_kdf_create",
    "cfm_kdf_destroy",
    "cfm_kdf_set_salt",
    "cfm_kdf_set_hash",
    "cfm_kdf_set_iterations",
    "cfm_kdf_set_memory_cost",
    "cfm_kdf_set_parallelism",
    "cfm_kdf_derive",
    "cfm_rng_create",
    "cfm_rng_destroy",
    "cfm_rng_reseed",
    "cfm_rng_add_entropy",
    "cfm_rng_generate",
    "cfm_sig_keypair_generate",
    "cfm_sig_signer_create",
    "cfm_sig_signer_destroy",
    "cfm_sig_signer_update",
    "cfm_sig_signer_finalize",
