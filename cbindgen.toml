    "cfm_sig_verifier_create",
    "cfm_sig_verifier_destroy",
    "cfm_sig_verifier_update",
    "cfm_sig_verifier_finalize",
    "cfm_sig_verifier_set_hash",
    "cfm_kem_keypair_generate",
    "cfm_kem_encapsulator_create",
    "cfm_kem_encapsulator_destroy",
    "cfm_kem_encapsulate",
    "cfm_kem_decapsulator_create",
