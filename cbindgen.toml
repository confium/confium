# cbindgen configuration for confium-core
#
# Generates the host C ABI header (target/confium.h) covering the `cfm_*`
# symbols exported by the libconfium shared library (the host FFI that
# consumers such as the Ruby bindings, the CLI, and C/C++ integrations link
# against).
#
# Plugin-side `cfmp_*` symbols are generated by `confium-macros` into each
# plugin crate; see docs/plugin-author-guide.adoc and the per-plugin header
# emitted by the `#[confium::plugin]` macro expansion.
#
# Regenerate with:
#   cbindgen --config cbindgen.toml --crate confium-core --output target/confium.h
#
# The CMake build (CMakeLists.txt, BUILD_C_BINDINGS=ON) regenerates this
# header on every cargo build of confium-core.

language = "C"
header = """
/* Copyright (c) Ribose Inc. All rights reserved. */
/*
 * confium.h - generated C bindings for the confium host library (libconfium).
 *
 * DO NOT EDIT. Regenerate via:
 *   cbindgen --config cbindgen.toml --crate confium-core --output target/confium.h
 *
 * These bindings cover the `cfm_*` host FFI symbols. Plugin authors should
 * refer to the plugin contract (`cfmp_*`) documented in
 * docs/plugin-author-guide.adoc.
 */
"""
autogen_warning = "/* Warning: this file is auto-generated by cbindgen. Do not edit. */"
include_guard = "CONFIUM_H"
cpp_compat = true
style = "both"
tab_width = 4
line_length = 100

[parse]
# Parse the confium-core crate only.
parse_deps = false
include = ["confium-core"]
clean = false

# Macro expansion (`[parse.expand]`) is intentionally NOT enabled. The crate
# uses edition 2024 with the `#[unsafe(no_mangle)]` attribute syntax; cbindgen
# 0.29+ parses this statically. Enabling expansion would require a nightly
# rustc (`-Zunpretty=expanded`), which is not available in the release/docs CI
# images. If a future attribute is added that cbindgen cannot parse statically,
# prefer source-side adjustments (e.g. `#[export_name = "..."]`) over nightly
# expansion.


[fn]
# No prefix rewriting: the existing `cfm_` prefix is already baked into each
# function name via `#[unsafe(no_mangle)]`.

[struct]
derive_eq = false
derive_neq = false
derive_lt = false
derive_lte = false
derive_gt = false
derive_gte = false
derive_ostream = false

[enum]
prefix_with_name = false
derive_helper_methods = false
add_sentinel = false

[export]
# Pin the host FFI symbols that must appear in the header. This guards
# against cbindgen's reachability analysis pruning entry points that are
# only referenced from C consumers (not from within the Rust crate).
include = [
    "cfm_create",
    "cfm_destroy",
    "cfm_version_string",
    "cfm_version_major",
    "cfm_version_minor",
    "cfm_version_patch",
    "cfm_version_component",
    "cfm_string_destroy",
    "cfm_plugin_load",
    "cfm_plugin_unload",
    "cfm_err_destroy",
    "cfm_err_get_msg",
    "cfm_err_get_code",
    "cfm_err_get_source",
    "cfm_err_get_backtrace",
    "cfm_opts_create",
    "cfm_opts_destroy",
    "cfm_opts_clear",
    "cfm_opts_set_string",
    "cfm_opts_set_u",
    "cfm_opts_get_string",
    "cfm_opts_get_u",
    "cfm_opts_remove",
    "cfm_hash_create",
    "cfm_hash_destroy",
    "cfm_hash_clone",
    "cfm_hash_update",
    "cfm_hash_finalize",
    "cfm_hash_reset",
    "cfm_hash_output_size",
    "cfm_hash_block_size",
    "cfm_cipher_create",
    "cfm_cipher_destroy",
    "cfm_cipher_reset",
    "cfm_cipher_update",
    "cfm_cipher_finalize",
    "cfm_cipher_key_size",
    "cfm_cipher_iv_size",
    "cfm_cipher_block_size",
    "cfm_aead_create",
    "cfm_aead_destroy",
    "cfm_aead_set_nonce",
    "cfm_aead_associated_data_update",
    "cfm_aead_encrypt_update",
