[package]
name = "confium-composite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
readme = "README.md"
description = "Composite multi-algorithm signature aggregation for PQ migration in Confium"
documentation = "https://docs.rs/confium-composite"
keywords = ["crypto", "composite", "pqc", "signature", "confium"]


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
pq = ["dep:ml-dsa"]
pq-slh = ["dep:slh-dsa", "dep:hybrid-array"]
# Wycheproof adversarial test vector integration. Off by default —
# callers download the vector JSON from
# https://github.com/google/wycheproof on demand.
wycheproof = ["dep:hex"]

[dependencies]
getrandom = { workspace = true }
ml-dsa = { workspace = true, optional = true }
slh-dsa = { workspace = true, optional = true }
hybrid-array = { version = "0.4", optional = true, features = ["extra-sizes"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
ed25519-dalek = { workspace = true, features = ["rand_core"] }
rand_core = { workspace = true }
p256 = { workspace = true, features = ["ecdsa"] }
hex = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
p256 = { workspace = true, features = ["ecdsa", "arithmetic"] }

[lib]
crate-type = ["rlib"]
