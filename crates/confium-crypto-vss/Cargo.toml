[package]
name = "confium-crypto-vss"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories = ["cryptography"]
description = "Verifiable secret sharing, Paillier, Schnorr proofs, and NIZK primitives"
documentation = "https://docs.rs/confium-crypto-vss"
keywords = ["crypto", "vss", "paillier", "schnorr", "confium"]

[lib]
crate-type = ["rlib"]

[features]
# Demo/experimental primitives with known soundness gaps. Off by
# default; building them opts in explicitly and is a statement that
# the consumer has reviewed the module docs.
unaudited-experimental = []

[dependencies]
getrandom = { workspace = true }
p256 = { workspace = true, features = ["ecdsa", "arithmetic"] }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
num-bigint = { workspace = true, features = ["rand"] }
num-integer = { workspace = true }
num-traits = { workspace = true }
rand_core = { workspace = true }
hex = { workspace = true }
zeroize = { workspace = true }
