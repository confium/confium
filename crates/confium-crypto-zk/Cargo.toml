[package]
name = "confium-crypto-zk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories = ["cryptography"]
description = "Zero-knowledge proof systems: set membership, signature possession, accumulators"
documentation = "https://docs.rs/confium-crypto-zk"
keywords = ["crypto", "zk", "proof", "confium"]

[lib]
crate-type = ["rlib"]

[features]
# Demo/experimental primitives with known gaps. Off by default.
unaudited-experimental = []

[dependencies]
getrandom = { workspace = true }
p256 = { workspace = true, features = ["ecdsa", "arithmetic"] }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
num-bigint = { workspace = true, features = ["rand"] }
num-traits = { workspace = true }
rand_core = { workspace = true }
hex = { workspace = true }
