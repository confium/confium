[package]
name = "confium-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
categories = ["cryptography", "authentication"]
readme = "README.md"
repository.workspace = true
keywords = ["crypto", "daemon", "rpc", "threshold", "confium"]
description = "JSON-RPC daemon for the Confium threshold cryptography framework"
documentation = "https://docs.rs/confium-daemon"

[[bin]]
name = "confiumd"
path = "src/main.rs"


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# The confium-core crate exposes its lib under the name `confium`
# (matching the C ABI lib name `libconfium.so`). Rename it so Rust code
# imports as `confium_core::*` for clarity.
confium_core = { package = "confium-core", path = "../../crates/confium-core" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "macros", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
snafu = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "macros", "io-util", "sync", "time", "test-util"] }
