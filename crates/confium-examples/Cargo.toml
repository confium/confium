[package]
name = "confium-examples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords = ["crypto", "examples", "demo", "threshold", "confium"]
categories.workspace = true
readme = "README.md"
description = "Runnable example binaries demonstrating Confium threshold cryptography"
documentation = "https://docs.rs/confium-examples"


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
confium_core = { package = "confium-core", path = "../confium-core", version = "0.4.0" }
confium-tc = { workspace = true }
confium-tc-cmp20 = { workspace = true }
confium-tc-frost-p256 = { workspace = true }
confium-transparency = { workspace = true }
confium-pki = { workspace = true }
confium-privacy = { workspace = true }
confium-composite = { workspace = true }
confium-pkcs11-server = { workspace = true }
confium-store = { workspace = true }
confium-deployment = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
p256 = { workspace = true, features = ["ecdsa", "arithmetic"] }
chrono = { workspace = true }
elliptic-curve = { workspace = true }

[[example]]
name = "threshold_signing"
path = "src/bin/threshold_signing.rs"

[[example]]
name = "p256_threshold_signing"
path = "src/bin/p256_threshold_signing.rs"

[[example]]
name = "transparency_log_demo"
path = "src/bin/transparency_log_demo.rs"

[[example]]
name = "pkcs11_server_demo"
path = "src/bin/pkcs11_server_demo.rs"

[[example]]
name = "mini_cnml_demo"
path = "src/bin/mini_cnml_demo.rs"
