[package]
name = "confium-log-monitor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories = ["cryptography", "authentication"]
keywords = ["crypto", "transparency", "monitor", "confium"]
description = "Third-party monitor for Confium transparency logs — detects fork attempts and consistency violations"
readme = "README.md"

[[bin]]
name = "confium-log-monitor"
path = "src/main.rs"

[dependencies]
confium-transparency = { workspace = true }
anyhow = "1"
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
reqwest = { version = "0.13", features = ["blocking", "json"] }
tokio = { version = "1", features = ["full"] }
chrono = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sled = "0.34"
