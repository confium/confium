[package]
name = "confium-node"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories = ["cryptography", "authentication"]
keywords = ["crypto", "threshold", "node", "napi", "confium"]
description = "Node.js bindings for the Confium threshold cryptography framework"
readme = "README.md"

[lib]
crate-type = ["cdylib"]

[dependencies]
confium-tc-cmp20 = { workspace = true }
confium-tc-gg18 = { workspace = true }
confium-tc-frost-p256 = { workspace = true }
confium-tc-elgamal-p256 = { workspace = true }
confium-composite = { workspace = true }
confium-transparency = { workspace = true }
napi = { version = "2", features = ["napi8"] }
napi-derive = "2"
hex = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
napi-build = "2"
