[package]
name = "confium-pki-tc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories = ["cryptography"]
description = "Threshold PKI integration: CT log, OCSP, ACME, attribute-based encryption"
documentation = "https://docs.rs/confium-pki-tc"
keywords = ["crypto", "pki", "threshold", "confium"]

[lib]
