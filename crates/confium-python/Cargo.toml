[package]
name = "confium-python"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
authors = ["Ribose Open <open.source@ribose.com>"]
license = "BSD-2-Clause"
homepage = "https://www.confium.org/"
repository = "https://github.com/confium/confium"
categories = ["cryptography", "authentication"]
keywords = ["crypto", "threshold", "python", "confium"]
description = "Python bindings for the Confium threshold cryptography framework"
readme = "README.md"

[lib]
name = "confium"
crate-type = ["cdylib"]

[dependencies]
confium-core = "0.2"
confium-composite = { path = "../confium-composite", version = "0.4.0" }
confium-transparency = { path = "../confium-transparency", version = "0.4.0" }
confium-pki = { path = "../confium-pki", version = "0.4.0", features = ["cms"] }
confium-attributes = { path = "../confium-attributes", version = "0.4.0" }
confium-deployment = { path = "../confium-deployment", version = "0.4.0" }
pyo3 = { version = "0.22", features = ["extension-module"] }
serde_json = "1"
sha2 = "0.10"
chrono = "0.4"
hex = "0.4"
ed25519-dalek = "2"
p256 = { version = "0.13", features = ["ecdsa"] }

[package.metadata.maturin]
python-source = "python"
module-name = "confium"

[workspace]
