[package]
name = "confium-sandbox-process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
categories = ["cryptography", "authentication"]
readme = "README.md"
repository.workspace = true
keywords = ["crypto", "sandbox", "process", "isolation", "confium"]
description = "Out-of-process sandbox for isolating Confium plugin execution"
documentation = "https://docs.rs/confium-sandbox-process"

[lib]
crate-type = ["rlib"]

# Test-only binary that speaks the subprocess JSON-RPC protocol. The
# integration tests spawn it via `CARGO_BIN_EXE_cfm-echo-plugin`. Not
# part of the library surface; kept small and self-contained.
[[bin]]
name = "cfm-echo-plugin"
path = "src/bin/echo_plugin.rs"


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
snafu = { workspace = true }
