[package]
name = "confium-signerd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories = ["cryptography", "authentication"]
keywords = ["crypto", "threshold", "signer", "daemon", "confium"]
description = "Distributed threshold signing daemon — connects to coordinator and responds to signing requests"
publish = false

[[bin]]
name = "confium-signerd"
path = "src/main.rs"

[dependencies]
confium-net-noise = { workspace = true }
confium-coordinator = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# `confium-net-noise` is link-only: registering the noise:// transport
# happens through `register_transport!` statics, not direct use.
[package.metadata.cargo-machete]
ignored = ["confium-net-noise"]
