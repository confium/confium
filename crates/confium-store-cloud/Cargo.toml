[package]
name = "confium-store-cloud"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
categories = ["cryptography", "authentication"]
readme = "README.md"
repository.workspace = true
keywords = ["crypto", "cloud", "kms", "aws", "gcp"]
description = "AWS, GCP, and Azure cloud KMS storage backend for Confium"
documentation = "https://docs.rs/confium-store-cloud"

[lib]
name = "confium_store_cloud"
crate-type = ["cdylib", "rlib"]

[features]
default = []

# AWS Key Management Service. Pulls `aws-config` (credentials, region,
# retry policy) and `aws-sdk-kms` (the KMS client). `default-features =
# false` on both keeps the tree lean; consumers enable `rustls` /
# `behavior-version-latest` via the SDK's own features if they need them.
aws-kms = ["dep:aws-config", "dep:aws-sdk-kms"]

# Google Cloud Key Management Service. Pulls `google-cloud-kms`, the
# high-level async KMS client. The `google-cloud-gax` transport comes
# transitively.
gcp-kms = ["dep:google-cloud-kms", "dep:google-cloud-auth"]

# Azure Key Vault. Pulls `azure_security_keyvault`; the shared
# `azure_core` types it depends on come in transitively at the matching
# 0.21.x version (the Azure SDK for Rust keeps the major version
# aligned across its crates).
azure-keyvault = ["dep:azure-security-keyvault", "dep:azure-identity", "dep:azure-core", "dep:sha2", "dep:base64"]


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
confium-store = { workspace = true }
tokio = { workspace = true }
# Used by the `register_backend!` macro (absolute path).
inventory = { workspace = true }

# --- AWS KMS -------------------------------------------------------------
aws-config = { version = "1.10", default-features = false, features = ["behavior-version-latest", "rt-tokio"], optional = true }
aws-sdk-kms = { version = "1.114", default-features = false, features = ["behavior-version-latest", "default-https-client"], optional = true }

# --- Google Cloud KMS ----------------------------------------------------
google-cloud-kms = { version = "0.6", default-features = false, features = ["auth"], optional = true }
google-cloud-auth = { version = "1.16", default-features = false, optional = true }

# --- Azure Key Vault -----------------------------------------------------
# Renamed to `azure_security_keyvault` on crates.io; the local alias
# avoids Rust's snake_case lints tripping on the underscore-heavy
# upstream crate name when consumers reference it from feature flags.
azure-security-keyvault = { version = "0.21", default-features = false, optional = true, package = "azure_security_keyvault" }
azure-identity = { version = "0.21", default-features = false, optional = true, package = "azure_identity" }
azure-core = { version = "0.21", default-features = false, optional = true, package = "azure_core" }
sha2 = { workspace = true, optional = true }
base64 = { version = "0.23", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = "0.6" 

[package.metadata.cargo-machete]
# `inventory` is consumed by a workspace macro (register_transport!,
# register_backend!, or register_tc_scheme!) via absolute path
# `::inventory::submit!` — no `use inventory` in source.
ignored = ["inventory"]
