[package]
name = "confium-tc-gg18"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
categories = ["cryptography", "authentication"]
readme = "README.md"
repository.workspace = true
keywords = ["crypto", "ecdsa", "threshold", "gg18", "confium"]
description = "GG18 threshold ECDSA for Confium"
documentation = "https://docs.rs/confium-tc-gg18"

[lib]
crate-type = ["rlib"]


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
getrandom = { workspace = true }
confium-tc = { workspace = true }
# Used by the `register_tc_scheme!` macro (absolute path).
inventory = { workspace = true }
crypto-bigint = { workspace = true }
elliptic-curve = { workspace = true, features = ["digest", "sec1"] }
p256 = { workspace = true, features = ["pkcs8", "serde"] }
sha2 = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
p256 = { workspace = true, features = ["pkcs8"] }
rand = { version = "0.8", default-features = false, features = ["std"] }
rand_core = { version = "0.6", default-features = false }

[package.metadata.cargo-machete]
# `inventory` is consumed by a workspace macro (register_transport!,
# register_backend!, or register_tc_scheme!) via absolute path
# `::inventory::submit!` — no `use inventory` in source.
ignored = ["inventory"]
