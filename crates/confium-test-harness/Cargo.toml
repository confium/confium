[package]
name = "confium-test-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
categories = ["cryptography", "authentication"]
readme = "README.md"
repository.workspace = true
keywords = ["crypto", "nist", "mpts", "test", "benchmark"]
description = "NIST MPTS evaluation harness for Confium threshold schemes"
documentation = "https://docs.rs/confium-test-harness"

[lib]
crate-type = ["rlib"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
confium-core = { workspace = true } # exposed via the `confium` lib name
confium-tc = { workspace = true }
inventory = { workspace = true }
serde = { workspace = true }
serde_json = "1"
snafu = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
libloading = { workspace = true }

[[bench]]
name = "sim"
harness = false

[package.metadata.cargo-machete]
# `confium-core` exposes the lib under the name `confium` (see
# `[lib] name = "confium"` in its Cargo.toml). Machete scans by
# `use confium_core::`, which doesn't match.
ignored = ["confium-core"]
