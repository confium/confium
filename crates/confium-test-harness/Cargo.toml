[package]
name = "confium-test-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Test harness for Confium (mock plugins, NIST eval vectors)"

[lib]
crate-type = ["rlib"]

[build-dependencies]
# (no extra deps; build.rs is std-only)

[dependencies]
confium-api = { workspace = true }
confium-core = { workspace = true }
confium-net = { workspace = true }
confium-tc = { workspace = true }
inventory = { workspace = true }
serde = { workspace = true }
serde_json = "1"
snafu = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
confium-api = { workspace = true }
confium-core = { workspace = true }
confium-mock-plugin = { path = "../confium-mock-plugin" }
criterion = { workspace = true }
libloading = { workspace = true }

[[bench]]
name = "sim"
harness = false
