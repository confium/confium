# NIST MPTS conformance vector: mock-tc-sig under a byzantine-drop fault.
#
# One of three parties (eve) silently drops her round-2 broadcast —
# the round that carries each party's HMAC tag. Because the vector
# sets threshold = parties = 3, every party's tag is required for the
# threshold check in mock-tc-sig::round2 to pass. With eve's tag
# missing, each honest party observes only 2 distinct contributors
# (itself + the other honest party), below the threshold of 3, and
# the scheme aborts with a threshold-violation error.
#
# The runner converts that scheme error into Outcome::Aborted — a
# clean abort. This vector therefore exercises the Byzantine-detection
# path end-to-end: the harness drives the protocol, the scheme
# detects the missing contribution, and the run terminates without
# producing a (potentially invalid) signature.
#
# Schema: crates/confium-test-harness/src/vector.rs
# Design: TODO.roadmap/09-nist-evaluation-harness.md

conformance_level = "must_pass"
reference = "https://confium.org/schemes/mock-tc-sig.html"
expected_round_count = 3
share_material = "default"

[scheme]
name = "mock-tc-sig"
version = "in-repo"

[test]
parties = 3
threshold = 3
message = "nist-vector-byzantine-drop"
seed = "0xbadf00d"

[[peer_behavior]]
party_id = "alice"
type = "honest"

[[peer_behavior]]
party_id = "bob"
type = "honest"

[[peer_behavior]]
# eve goes silent in round 2 — her HMAC tag never reaches the other
# parties. drop_round = 2 targets the mock's round-1 broadcast
# (Message::broadcast round field = 2), which carries the tag.
party_id = "eve"
type = "byzantine-drop"
drop_round = 2
