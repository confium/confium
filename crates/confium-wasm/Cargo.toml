[package]
name = "confium-wasm"
version = "0.4.5"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
readme = "README.md"
description = "Browser/Node.js verifier package for Confium — composite signatures, transparency proofs, certificate validation. WASM-bindgen surface; verifier-only by design."
documentation = "https://docs.rs/confium-wasm"
keywords = ["crypto", "wasm", "verifier", "confium", "browser"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["verify-composite", "verify-transparency", "verify-attributes", "verify-pki"]
# Each verify-* flag gates a subtree of the verifier surface. Off by default
# would let consumers tree-shake aggressively; we ship them all on by default
# so `@confium/confium-wasm` works out of the box.
verify-composite = ["dep:confium-composite"]
verify-transparency = ["dep:confium-transparency"]
verify-attributes = ["dep:confium-attributes"]
verify-pki = ["dep:confium-pki"]
# The `sign` feature gates the signing surface. **Off by default** for
# the browser build — browsers verify, servers sign. Enable this when
# building for a WASI host (Cloudflare Workers, Fastly Compute@Edge,
# Vercel Edge, Deno, Bun, Wasmtime, Wasmer) where the WASM module IS
# the server and needs to produce signatures.
#
# Build with: `cargo build --target wasm32-wasip1 --features sign`
sign = [
  "dep:confium-tc-cmp20",
  "dep:confium-tc-gg18",
  "dep:confium-tc-frost-p256",
  "dep:confium-tc-elgamal-p256",
]

[dependencies]
confium-composite = { workspace = true, optional = true }
confium-transparency = { workspace = true, optional = true }
confium-attributes = { workspace = true, optional = true }
confium-pki = { workspace = true, optional = true }
confium-tc-cmp20 = { workspace = true, optional = true }
confium-tc-gg18 = { workspace = true, optional = true }
confium-tc-frost-p256 = { workspace = true, optional = true }
confium-tc-elgamal-p256 = { workspace = true, optional = true }

wasm-bindgen = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
js-sys = "0.3"
chrono = { workspace = true }

# Verifier-only deps — all WASM-friendly, no filesystem, no threads.
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
p256 = { version = "0.13", features = ["ecdsa"] }

# WASM needs the `js` feature on getrandom so it falls back to
# `crypto.getRandomValues` in the browser. Without it, getrandom fails to
# compile for `wasm32-unknown-unknown`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "0.2"
