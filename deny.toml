# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/index.html

[advisories]
# Security advisories from RustSec
version = 2
# Raise errors on yanked crates
yanked = "deny"

# Informational advisories for unmaintained transitive deps we cannot
# fix without upstream changes. Actual CVEs are NOT ignored.
ignore = [
    "RUSTSEC-2025-0057", # fxhash unmaintained (transitive)
    "RUSTSEC-2024-0384", # instant unmaintained (transitive)
    "RUSTSEC-2024-0436", # paste unmaintained (transitive)
    "RUSTSEC-2025-0134", # rustls-pemfile unmaintained (transitive)
    "RUSTSEC-2026-0174", # http-types ASCII invariant (transitive, not consumed)
    # azure_core legacy SDK logs the authorization header at debug
    # level (local-only exposure, AV:L; MSRC: not a vulnerability).
    # Fix is the azure_core 1.x migration in confium-store-cloud —
    # tracked in TODO.private-report. Opt-in feature only.
    "RUSTSEC-2026-0275",
]

[licenses]
# License checking configuration
version = 2

# Allow these licenses — must be compatible with BSD-2-Clause
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    # MPL-2.0 is a weak copyleft, file-level license; compatible with
    # BSD-2-Clause distribution. Pulled in by `dirs` → `option-ext`.
    "MPL-2.0",
    # CDLA-Permissive-2.0 is a permissive data-license; compatible with
    # BSD-2-Clause. Pulled in by `ureq` → `webpki-roots` (Mozilla's CA
    # root bundle).
    "CDLA-Permissive-2.0",
]

# Confidence threshold for license detection
confidence-threshold = 0.8

# Private crates that don't need license checks
private = { ignore = true }

[bans]
# Warn on multiple versions of the same crate
multiple-versions = "warn"

# Deny specific crates we don't want in the tree
deny = [
    { name = "openssl", use-instead = "rustls" },
]

[sources]
# Allow crates from these registries
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# Allow git sources for specific repositories
allow-git = []

# Require specifiers for git sources
unknown-git = "deny"

[output]
feature-depth = 1
