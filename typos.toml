# Configuration for typos spell checker
# See: https://github.com/crate-ci/typos

[files]
extend-exclude = [
    "target/",
    ".git/",
    "cpp-tests/",
    "cmake/",
    # Local-only planning files — never committed, often contain
    # domain shorthand ("OT", "mis-issuance") that typos flags.
    "TODO.completion/",
    "TODO.complete/",
    "TODO.roadmap/",
    "TODO.finalize/",
    "TODO.restructure/",
]

[default.extend-words]
# Project-specific terms
confium = "confium"
Confium = "Confium"

# Cryptography and FFI terms
ffi = "ffi"
cfm = "cfm"
cfmp = "cfmp"
hashif = "hashif"

# Rust/code terms
vtable = "vtable"
vtables = "vtables"
keystore = "keystore"
keystores = "keystores"
botan = "botan"

# Documentation terms
adoc = "adoc"
asciidoc = "asciidoc"
AsciiDoc = "AsciiDoc"

# Compound-word forms that typos splits into incorrect parts.
hashicorpvault = "hashicorpvault"
certificat = "certificat"
cose = "cose"
gost = "gost"

# PKI / MPC terms that look like typos to the dictionary.
# - "mis-issuance" is the standard RFC 6962 term for a CA issuing a
#   cert it shouldn't have. The hyphen causes typos to flag the bare
#   prefix "mis".
# - "ot" / "OT" — Oblivious Transfer. The all-caps form collides with
#   the typo "OT" (for "TO"). Both forms are correct here.
# - "AIMD" — Additive Increase / Multiplicative Decrease (congestion
#   control algorithm).
mis = "mis"
Mis = "Mis"
ot = "ot"
OT = "OT"
AIMD = "AIMD"

[default.extend-identifiers]
# PascalCase / camelCase forms that typos' word segmentation heuristic
# splits into bogus parts (e.g. "HashiCorp" → "Hashi" + "Corp", then
# flags "Hashi" as a typo of "Hash"). Listing the full identifier
# here tells typos to skip segmentation for these tokens.
HashiCorp  = "HashiCorp"
Certificat = "Certificat"
COSE       = "COSE"
GOST       = "GOST"